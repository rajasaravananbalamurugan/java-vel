# ===== ATM INSTANCE CONFIGURATION =====
# Give every physical ATM a UNIQUE ID.
atm.id=ATM-01

# Optional location label.
atm.location=Demo Location

# ===== SHARED CENTRAL DATABASE =====
# For one-PC testing, keep 127.0.0.1.
# For multiple computers, replace with the IP address of the CENTRAL SERVER PC.
# Example: central.db.host=192.168.1.100
central.db.host=127.0.0.1
central.db.port=3306
central.db.name=atm_db

# Use a dedicated database account for a real deployment.
central.db.user=root
central.db.password=AtmRoot@12345
